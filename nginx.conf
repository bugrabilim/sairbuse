# Bumba Genel Standartlar §8: HSTS, CSP ve diğer güvenlik başlıkları burada (statik site, kendi nginx'i).
# Başlıklar yalnız server düzeyinde eklenir; location içinde add_header kullanılırsa nginx bunları siler.

# Astro'nun adı içeriğine göre değişen dosyaları bir yıl önbellekte kalabilir
map $uri $onbellek {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "";
}

# İçerik paneli (Sveltia CMS) unpkg'den yüklenir ve GitHub API'sine bağlanır; ona ayrı, gevşek bir CSP
map $uri $csp {
    ~^/admin/   "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
    default     "default-src 'self'; script-src 'self' 'unsafe-inline' https://istatistik.bumba.tr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://bumbagroup.com; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://istatistik.bumba.tr https://bumbagroup.com; form-action 'self' https://bumbagroup.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Coolify/Traefik HTTPS'i önde karşılar; yönlendirmeler göreli kalsın ki http'ye düşmesin
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/xml text/plain;

    # HSTS: 8 Ekim 2026'da 1 günle başladı; bir hafta sorunsuz geçince 31536000 yapılacak (CLAUDE.md)
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $onbellek;

    location /_astro/ {
        try_files $uri =404;
    }

    # İçerik panelinin ayar dosyası (config.yml) doğru türle gitsin
    location ~* \.ya?ml$ {
        types { }
        default_type text/yaml;
        try_files $uri =404;
    }

    location = /llms.txt {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # İngilizce sayfalardaki eksik adresler İngilizce 404'e düşsün
    location /en/ {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /en/404.html;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
