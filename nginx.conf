server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Coolify/Traefik HTTPS'i önde karşılar; yönlendirmeler göreli kalsın ki http'ye düşmesin
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Astro'nun adı içeriğine göre değişen dosyaları: bir yıl önbellekte kalabilir
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # İçerik panelinin ayar dosyası (config.yml) doğru türle gitsin
    location ~* \.ya?ml$ {
        types { }
        default_type text/yaml;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
