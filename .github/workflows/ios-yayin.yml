name: iOS yayın (TestFlight)

# Elle tetiklenir: uygulamayı imzalayıp App Store Connect'e yükler; yapı TestFlight'ta görünür, App Store'a
# gönderme App Store Connect'ten yapılır. Saat Tarih (bugrabilim/datetimehour) ile aynı yol: sertifika ve
# profil depoda ya da sırlarda yok. Arşiv imzasız alınır (geliştirme imzası kayıtlı cihaz ister, hesapta cihaz
# yok); dağıtım imzasını dışa aktarımda Xcode'un bulut imzalaması App Store Connect API anahtarıyla atar.
# Gereken sırlar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (uygulama/README.md).
on:
  workflow_dispatch:

concurrency:
  group: ios-yayin
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight'a yükle
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      PROJE: uygulama/ios/App/App.xcodeproj
    steps:
      - name: Anahtar denetimi
        run: |
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!s}" ]; then echo "::error::$s sırrı tanımlı değil (uygulama/README.md)"; exit 1; fi
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Site (uygulama kipi) ve iOS projesine kopyalama
        run: npm run uygulama
      - name: API anahtarı
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ARSIV=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Arşivle
        run: |
          xcodebuild -project "$PROJE" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARSIV" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} -quiet archive
      - name: Geçici imza
        # Dağıtım imzası mevcut imzanın üstüne atılır; imzasız arşivde önce gömülü çerçeveler (Capacitor),
        # sonra uygulama geçici (ad hoc) imzalanır. Uygulamanın ek yetkisi (entitlement) yok.
        run: |
          APP="$ARSIV/Products/Applications/App.app"
          for X in "$APP"/Frameworks/*; do [ -e "$X" ] && codesign --force --sign - "$X"; done
          codesign --force --sign - "$APP"
          codesign -dv "$APP"
      - name: Yükle
        run: |
          xcodebuild -exportArchive -archivePath "$ARSIV" \
            -exportOptionsPlist uygulama/ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yüklenen yapı numarası: ${{ github.run_number }}"
      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
