name: iOS yayın (TestFlight)

# Elle tetiklenir: uygulamayı App Store için imzalar ve App Store Connect'e yükler. Yükleme bitince sürüm
# TestFlight'ta görünür; App Store'a gönderme App Store Connect'ten yapılır. Gereken sırlar ve ilk kurulum:
# uygulama/README.md. Mac gerekmez: imzalama App Store Connect API anahtarıyla bu makinede yapılır.
on:
  workflow_dispatch:

env:
  PAKET: tr.bumba.duygularinpesinde
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Sırlar tanımlı mı
        run: |
          for s in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!s}" ]; then echo "::error::$s sırrı tanımlı değil (uygulama/README.md)"; exit 1; fi
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Site (uygulama kipi) ve iOS projesine kopyalama
        run: npm run uygulama
      - name: İmzalama araçları
        run: pip3 install --break-system-packages codemagic-cli-tools
      - name: Paket kimliği, sertifika ve profil
        run: |
          set -e
          keychain initialize
          if ! app-store-connect bundle-ids list --bundle-id-identifier "$PAKET" --strict-match-identifier | grep -q "$PAKET"; then
            app-store-connect bundle-ids create "$PAKET" --name "Duygularin Pesinde" --platform IOS
          fi
          app-store-connect fetch-signing-files "$PAKET" --platform IOS --type IOS_APP_STORE --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles --project uygulama/ios/App/App.xcodeproj
      - name: Yapı numarası
        run: sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" uygulama/ios/App/App.xcodeproj/project.pbxproj
      - name: Arşiv ve ipa
        run: xcode-project build-ipa --project uygulama/ios/App/App.xcodeproj --scheme App
      - name: App Store Connect'e yükleme
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: build/ios/ipa/
          if-no-files-found: ignore
