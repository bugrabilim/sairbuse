name: Geçici ses denemesi
# GEÇİCİ: uygulamadaki fetch + mp3 davranışını ölçer; birleştirmeden önce silinir.
on:
  pull_request:
    paths: ['.github/gecici/**', '.github/workflows/gecici-ses.yml', 'src/scripts/ortam.ts']
jobs:
  deneme:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: WKWebView ile fetch ve çözme
        run: |
          mkdir -p kok/ortam
          cp public/ortam/deniz.mp3 kok/ortam/
          cp .github/gecici/deneme.html kok/
          swiftc -O .github/gecici/ses.swift -o ses
          ./ses "$PWD/kok"
