name: iOS inceleme

# Elle tetiklenir: App Store incelemesindeki gönderimin ve öğelerinin durumunu yazar (scripts/uygulama/inceleme.py).
# "yeniden-gonder" seçilirse reddedilen öğeyi çözüldü sayar ve gönderimi yeniden incelemeye yollar
# (App Review'un bilgi isteğine cevap yazıldıktan sonra "Resubmit to App Review" düğmesinin yaptığı iş).
on:
  workflow_dispatch:
    inputs:
      islem:
        description: Ne yapılsın
        type: choice
        options: [durum, yeniden-gonder]
        default: durum

jobs:
  inceleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ISLEM: ${{ inputs.islem }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography
      - run: |
          if [ "$ISLEM" = "yeniden-gonder" ]; then
            python3 scripts/uygulama/inceleme.py gonder
          else
            python3 scripts/uygulama/inceleme.py
          fi
